[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spanql"
version = "0.1.0"
description = "Grounded Q&A over docs, logs, files and code with traceable formulas"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "John Clem" }]
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pathspec>=0.12",
]

[project.optional-dependencies]
code = [
  "tree-sitter>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-go>=0.23",
]
pdf = ["pypdf>=5.0"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
spanql = "spanql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spanql"]

[tool.hatch.build.targets.sdist]
include = ["src/spanql", "tests", "README.md", "docs", "packaging", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF012", "SIM108"]

[tool.mypy]
python_version = "3.12"
packages = ["spanql"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
markers = [
  "live: needs a real model server (SPANQL_LIVE_ENDPOINT); skipped by default",
]
