[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spanql"
version = "0.1.0"
description = "Grounded Q&A over docs, logs, files and code with traceable formulas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []          # the core is deliberately stdlib-only (see docs/IMPLEMENTATION.md)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spanql = "spanql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
