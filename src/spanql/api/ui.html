<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spanql</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#272b35; --fg:#e6e6e6; --dim:#9aa0aa; --acc:#7cc4ff; --ok:#7ee787; --warn:#f2cc60; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns: 1fr 420px; height:100vh; }
  main { display:flex; flex-direction:column; border-right:1px solid var(--line); min-width:0; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { font-size:17px; } header span { color:var(--dim); font-size:13px; }
  #log { flex:1; overflow:auto; padding:16px; }
  .q { color:var(--dim); margin:18px 0 6px; } .a { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; }
  .a.not_found, .a.ambiguous { border-color:var(--warn); }
  .chip { display:inline-block; margin:6px 6px 0 0; padding:2px 8px; border-radius:12px; background:#1f3347; color:var(--acc); cursor:pointer; font-size:13px; border:0; }
  .meta { color:var(--dim); font-size:12px; margin-top:6px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font-size:15px; }
  button.go { padding:10px 16px; border-radius:8px; border:0; background:var(--acc); color:#001; font-weight:600; cursor:pointer; }
  aside { overflow:auto; padding:16px; background:#12151b; }
  aside h3 { margin:0 0 8px; font-size:14px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; font-size:12.5px; }
  .src { color:var(--ok); font-size:12px; } mark { background:#3b3200; color:var(--warn); }
</style>
</head>
<body>
<main>
  <header><b>spanql</b><span>answers you can audit like a spreadsheet</span><span id="st"></span></header>
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="Ask about your docs, logs, files and code…" autocomplete="off"><button class="go">Ask</button></form>
</main>
<aside id="panel"><h3>Provenance</h3><div class="meta">Click a value to see its formula, evaluation steps and the exact source text.</div></aside>
<script>
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const token = new URLSearchParams(location.hash.slice(1)).get('token');
const hdrs = token ? {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
const conv = 'ui-' + Math.random().toString(36).slice(2);
fetch('/v1/status', {headers: hdrs}).then(r => r.json()).then(s => {
  document.getElementById('st').textContent = `${s.store.sources} sources · ${s.store.current_blocks} passages · model: ${s.model.backend}${s.model.ok ? '' : ' (offline)'}`;
}).catch(() => {});
function showCell(c) {
  const p = document.getElementById('panel'); p.replaceChildren($('h3', '', 'Cell ' + c.id));
  p.append($('div', '', c.value.display), $('div', 'meta', 'formula'), $('pre', '', c.formula), $('div', 'meta', 'steps'));
  p.append($('pre', '', c.steps.map(s => `${s.op} → ${s.out}`).join('\n')), $('div', 'meta', 'inputs'));
  for (const i of c.inputs) {
    if (i.kind === 'span') {
      p.append($('div', 'src', `${i.source} · L${i.line}${i.page ? ' · p.' + i.page : ''} · ${i.consumed_span || i.id}${i.current ? '' : ' · source changed'}`));
      const pre = $('pre'); const t = i.text, k = i.consumed;
      if (k && t.includes(k)) { const at = t.indexOf(k); pre.append(t.slice(0, at), $('mark', '', k), t.slice(at + k.length)); } else pre.textContent = t;
      p.append(pre);
    } else if (i.kind === 'query') {
      p.append($('div', 'src', `${i.count} matches · ${i.query}`), $('pre', '', i.sql));
    } else { p.append($('div', 'src', `cell [${i.id}] = ${i.formula}`)); }
  }
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim(); if (!q) return;
  document.getElementById('q').value = '';
  const log = document.getElementById('log');
  log.append($('div', 'q', 'you › ' + q));
  const a = $('div', 'a', '…'); log.append(a); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch('/v1/ask', {method: 'POST', headers: hdrs, body: JSON.stringify({question: q, conversation_id: conv})});
    const d = await r.json();
    if (d.error) { a.textContent = d.error; return; }
    a.className = 'a ' + d.status; a.textContent = d.answer.text;
    for (const c of d.cells) { const b = $('button', 'chip', c.value.display); b.onclick = () => showCell(c); a.append(document.createElement('br'), b); }
    a.append($('div', 'meta', `${d.status} · ${d.attempts} attempt(s) · ${d.seconds}s` + (d.formula ? ' · ' + d.formula : '')));
    if (d.cells[0]) showCell(d.cells[0]);
  } catch (e) { a.textContent = 'error: ' + e; }
  log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
