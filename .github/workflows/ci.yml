name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      # offline only: the fake backend stands in for the model; live tests are skipped
      - run: uv run pytest --cov=spanql --cov-report=term
      - run: uv run spanql selftest --no-model

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: spanql:ci
      - run: docker run --rm spanql:ci selftest --no-model

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: brew style
        run: |
          brew tap-new --no-git local/spanql
          cp packaging/homebrew/spanql.rb "$(brew --repository)/Library/Taps/local/homebrew-spanql/Formula/"
          brew style local/spanql
